name: Claude

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: claude-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  claude:
    name: Claude works the issue
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'claude' && github.event.sender.login == github.repository_owner) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && github.event.comment.user.login == github.repository_owner)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.2
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          label_trigger: claude
          trigger_phrase: '@claude'
          allow_fork_prs: 'false'
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 30
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(corepack pnpm run:*),Bash(pnpm run:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(gh pr create:*)"
            --append-system-prompt "You run inside GitHub Actions for one issue. AGENTS.md holds for you, except that this action makes the commits and pushes the branch for you, and you open the pull request yourself. Build exactly what the issue's brief asks. Before you finish, run corepack pnpm run check and leave it green; if you cannot, say what fails on the issue and stop. Once it is green and pushed, open a draft pull request against main with gh pr create --draft, a conventional commit title, and a body that starts with Closes #<issue number>."
