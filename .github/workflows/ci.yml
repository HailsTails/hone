name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Discipline core on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      tarball-sha256: ${{ steps.tarball.outputs.sha256 }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.18.0
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check
        run: pnpm run check
      - name: Run Hone's disciplines on Hone
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE_REVISION"
          case "$base" in *[!0]*) ;; *) base=origin/main ;; esac
          pnpm run self-check --base-revision "$base"
      - name: Check the package builds deterministically
        run: pnpm run package-determinism
      - name: Pack the package
        run: pnpm run pack-package
      - name: Fingerprint the packed tarball
        id: tarball
        run: |
          tarballs=(artefacts/*.tgz)
          test "${#tarballs[@]}" -eq 1
          echo "sha256=$(sha256sum "${tarballs[0]}" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.2
      - name: Enable corepack on Node 24
        run: corepack enable
      - name: Prove the packed tarball installs and runs in real consumers on Node 24
        run: |
          tarballs=(artefacts/*.tgz)
          test "${#tarballs[@]}" -eq 1
          pnpm run install-proof --tarball "${tarballs[0]}"

  windows:
    name: Discipline core on Windows
    runs-on: windows-2025-vs2026
    timeout-minutes: 15
    outputs:
      tarball-sha256: ${{ steps.tarball.outputs.sha256 }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.18.0
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Pack the package
        run: pnpm run pack-package
      - name: Prove the packed tarball installs and runs in real consumers
        run: |
          tarballs=(artefacts/*.tgz)
          test "${#tarballs[@]}" -eq 1
          pnpm run install-proof --tarball "${tarballs[0]}"
      - name: Fingerprint the packed tarball
        id: tarball
        run: |
          tarballs=(artefacts/*.tgz)
          test "${#tarballs[@]}" -eq 1
          echo "sha256=$(sha256sum "${tarballs[0]}" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

  same-tarball:
    name: Packed tarball is the same on Linux and Windows
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      LINUX_SHA256: ${{ needs.linux.outputs.tarball-sha256 }}
      WINDOWS_SHA256: ${{ needs.windows.outputs.tarball-sha256 }}
    steps:
      - name: Refuse tarballs that differ between operating systems
        shell: bash
        run: |
          test -n "$LINUX_SHA256"
          test "$LINUX_SHA256" = "$WINDOWS_SHA256"
