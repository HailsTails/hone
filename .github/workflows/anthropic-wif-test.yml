name: Claude WIF smoke check

on:
  workflow_dispatch:

permissions: {}

jobs:
  exchange:
    if: github.repository == 'HailsTails/hone' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      id-token: write
    steps:
      - name: Verify the Claude token exchange
        shell: python
        env:
          ANTHROPIC_FEDERATION_RULE_ID: fdrl_011Acyb9NaZQ1aXZMKSszWY2
          ANTHROPIC_ORGANIZATION_ID: 6273dd14-3343-4014-bdb2-e4c1435f2215
          ANTHROPIC_SERVICE_ACCOUNT_ID: svac_01Qwv8Z44uiXuAEuUDVY6dBY
          ANTHROPIC_WORKSPACE_ID: wrkspc_01RrXstUv9L81ncYgjURbDnB
        run: |
          import json
          import os
          from contextlib import closing
          from http.client import HTTPSConnection
          from urllib.parse import SplitResult, urlencode, urlsplit, urlunsplit

          def read_json(address: SplitResult, *, method: str, headers: dict[str, str], body: bytes | None) -> object:
              if address.scheme != "https" or not address.hostname:
                  raise ValueError
              target = urlunsplit(("", "", address.path or "/", address.query, ""))
              with closing(HTTPSConnection(address.hostname, address.port, timeout=15)) as connection:
                  connection.request(method, target, body=body, headers=headers)
                  with connection.getresponse() as response:
                      if not 200 <= response.status < 300:
                          raise ValueError
                      return json.load(response)

          def read_token(response: object, field: str) -> str:
              if not isinstance(response, dict):
                  raise ValueError
              token = response.get(field)
              if not isinstance(token, str) or not token.strip():
                  raise ValueError
              return token

          stage = "GitHub OIDC request"
          try:
              claude_api = "https://api.anthropic.com"
              oidc = urlsplit(os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"])
              audience = urlencode({"audience": claude_api})
              query = f"{oidc.query}&{audience}" if oidc.query else audience
              request_token = os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
              identity = read_json(
                  oidc._replace(query=query),
                  method="GET",
                  headers={"Authorization": f"Bearer {request_token}"},
                  body=None,
              )
              assertion = read_token(identity, "value")

              stage = "Claude token exchange"
              body = json.dumps({
                  "grant_type": "urn:ietf:params:oauth:grant-type:jwt-bearer",
                  "assertion": assertion,
                  "federation_rule_id": os.environ["ANTHROPIC_FEDERATION_RULE_ID"],
                  "organization_id": os.environ["ANTHROPIC_ORGANIZATION_ID"],
                  "service_account_id": os.environ["ANTHROPIC_SERVICE_ACCOUNT_ID"],
                  "workspace_id": os.environ["ANTHROPIC_WORKSPACE_ID"],
              }).encode("utf-8")
              exchange = read_json(
                  urlsplit(f"{claude_api}/v1/oauth/token"),
                  method="POST",
                  headers={"Content-Type": "application/json"},
                  body=body,
              )
              if not isinstance(exchange, dict) or exchange.get("token_type") != "Bearer":
                  raise ValueError
              read_token(exchange, "access_token")
              expiry = exchange.get("expires_in")
              if type(expiry) is not int or expiry <= 0:
                  raise ValueError
          except Exception:
              raise SystemExit(f"{stage} failed.") from None

          print("Claude WIF token exchange succeeded.")
