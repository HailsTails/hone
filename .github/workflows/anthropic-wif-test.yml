name: Claude WIF smoke check

on:
  workflow_dispatch:

permissions: {}

jobs:
  exchange:
    if: github.repository == 'HailsTails/hone' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      id-token: write
    steps:
      - name: Verify the Claude token exchange
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          ANTHROPIC_FEDERATION_RULE_ID: fdrl_011Acyb9NaZQ1aXZMKSszWY2
          ANTHROPIC_ORGANIZATION_ID: 6273dd14-3343-4014-bdb2-e4c1435f2215
          ANTHROPIC_SERVICE_ACCOUNT_ID: svac_01Qwv8Z44uiXuAEuUDVY6dBY
          ANTHROPIC_WORKSPACE_ID: wrkspc_01RrXstUv9L81ncYgjURbDnB
        with:
          script: |
            try {
              const assertion = await core.getIDToken('https://api.anthropic.com');
              const response = await fetch('https://api.anthropic.com/v1/oauth/token', {
                method: 'POST',
                redirect: 'error',
                signal: AbortSignal.timeout(15_000),
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  grant_type: 'urn:ietf:params:oauth:grant-type:jwt-bearer',
                  assertion,
                  federation_rule_id: process.env.ANTHROPIC_FEDERATION_RULE_ID,
                  organization_id: process.env.ANTHROPIC_ORGANIZATION_ID,
                  service_account_id: process.env.ANTHROPIC_SERVICE_ACCOUNT_ID,
                  workspace_id: process.env.ANTHROPIC_WORKSPACE_ID,
                }),
              });
              if (!response.ok) throw new Error();

              const { token_type, access_token, expires_in } = await response.json();
              if (token_type !== 'Bearer' || typeof access_token !== 'string' ||
                  !access_token.trim() || !Number.isInteger(expires_in) || expires_in <= 0) {
                throw new Error();
              }
              core.info('Claude WIF token exchange succeeded.');
            } catch {
              core.setFailed('Claude WIF token exchange failed.');
            }
