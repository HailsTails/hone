name: Pull request title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]
  merge_group:

permissions: {}

concurrency:
  group: pull-request-title-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  title:
    name: Conventional pull request title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.18.0
      - name: Check the title is a conventional commit subject
        env:
          PULL_REQUEST_TITLE: ${{ github.event.pull_request.title }}
        run: node delivery/pull-request-title/pull-request-title-command.ts "$PULL_REQUEST_TITLE"
