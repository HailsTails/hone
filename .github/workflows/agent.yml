name: Agent

on:
  issues:
    types: [labeled]
  pull_request:
    types: [opened, ready_for_review, labeled]

permissions: {}

concurrency:
  group: agent-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

env:
  ANTHROPIC_API: https://api.anthropic.com/v1
  ANTHROPIC_VERSION: 2026-10-21
  ANTHROPIC_BETA: managed-agents-2026-04-01
  AGENT_MODEL: claude-opus-5-5
  BUDGET_CENTS: '1500'
  MODE: ${{ github.event_name == 'pull_request' && 'claude-review' || github.event.label.name }}
  NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
  AGENT_BRANCH: agent/issue-${{ github.event.issue.number }}
  CHECKOUT_BRANCH: ${{ github.event.pull_request.head.ref || 'main' }}
  STARTED_BY_LABEL: ${{ github.event.action == 'labeled' }}

jobs:
  agent:
    name: Managed agent
    if: >-
      (github.event_name == 'issues' &&
        contains(fromJSON('["claude", "claude-triage"]'), github.event.label.name) &&
        github.event.sender.login == github.repository_owner) ||
      (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        !github.event.pull_request.draft &&
        (github.event.action != 'labeled' ||
          (github.event.label.name == 'claude-review' && github.event.sender.login == github.repository_owner)))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions: {}
    defaults:
      run:
        shell: bash
    steps:
      - name: Mint the push token
        id: push-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: Iv23liOdEzeYFi4AjZwp
          private-key: ${{ secrets.RIN_AUTHOR_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: ${{ github.event.label.name == 'claude' && github.event_name == 'issues' && 'write' || 'read' }}

      - name: Start the session
        id: session
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PUSH_TOKEN: ${{ steps.push-token.outputs.token }}
          REPOSITORY_URL: ${{ github.event.repository.html_url }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          TITLE: ${{ github.event.issue.title || github.event.pull_request.title }}
          BODY: ${{ github.event.issue.body || github.event.pull_request.body }}
        run: |
          set -euo pipefail
          anthropic() {
            local response
            response=$(curl -sS --fail-with-body "$ANTHROPIC_API/$1" \
              -H "x-api-key: $ANTHROPIC_API_KEY" \
              -H "anthropic-version: $ANTHROPIC_VERSION" \
              -H "anthropic-beta: $ANTHROPIC_BETA" \
              -H "content-type: application/json" \
              --data-binary @-) || { echo "POST $1 failed: $response" >&2; return 1; }
            echo "$response"
          }
          workspace="/workspace/$REPOSITORY_NAME"
          standard=$(curl -sS --fail "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/AGENTS.md")
          case "$MODE" in
            claude)
              kind=Issue
              run_note="Push your work to the branch $AGENT_BRANCH."
              system=$(cat <<EOF
          You work on one issue of the $REPOSITORY_NAME repository, checked out at $workspace on main.
          Follow the AGENTS.md rules below, with these exceptions for this run:
          - Work on the new branch the first message names and push it to origin yourself. Do not open a pull request.
          - Set up with: corepack enable, then pnpm install --frozen-lockfile.
          Build exactly what the issue asks, no more. Before pushing, run pnpm run check and leave it green.
          Commit with a conventional commit subject, using the bot identity AGENTS.md names.
          If you cannot finish with a green check, push nothing and say why in your last message.
          Your last message is the pull request description: what changed and why, in a few short lines.
          EOF
              ) ;;
            claude-triage)
              kind=Issue
              run_note=""
              system=$(cat <<EOF
          You triage one issue of the $REPOSITORY_NAME repository, checked out at $workspace on main. The AGENTS.md rules below describe the repository.
          Change nothing, commit nothing, push nothing.
          Decide from the code on main, its tests and git history whether the issue still applies.
          Your last message is the triage, at most eight short lines, starting with one verdict:
          - Still applies: what is still wrong, with file paths, and whether a one-PR fix is clear enough to hand to an agent.
          - Already fixed: the commit or file that fixed it.
          - Obsolete: why version 2 no longer has the problem, with file paths.
          - Needs Helen: the one decision that blocks it.
          EOF
              ) ;;
            claude-review)
              kind="Pull request"
              run_note="Its branch $CHECKOUT_BRANCH is checked out."
              system=$(cat <<EOF
          You review one pull request of the $REPOSITORY_NAME repository, whose branch is checked out at $workspace.
          The AGENTS.md rules below, as they stand on main, are the review standard. Change nothing, commit nothing, push nothing.
          Run git fetch origin main, then review git diff origin/main...HEAD. The scope is the change: report only problems the change introduces or leaves open in what it touches.
          Look for correctness bugs, broken AGENTS.md rules, and missing or wrong unit tests for changed behaviour. You may run pnpm scripts after corepack enable and pnpm install --frozen-lockfile.
          Your last message is the review: each finding as one line with file:line, the problem, and why it matters, most severe first. With no findings, say No findings and what you checked, in one line.
          EOF
              ) ;;
          esac
          system="$system"$'\n\n# AGENTS.md on main\n\n'"$standard"
          agent_id=$(jq -n --arg name "hone-$MODE-$NUMBER" --arg model "$AGENT_MODEL" --arg system "$system" \
            '{name: $name, model: $model, system: $system, tools: [{type: "agent_toolset_20260401"}]}' \
            | anthropic agents | jq -r .id)
          echo "agent_id=$agent_id" >> "$GITHUB_OUTPUT"
          environment_id=$(jq -n --arg name "hone-$MODE-$NUMBER" \
            '{name: $name, config: {type: "cloud", networking: {type: "limited", allow_package_managers: true}}}' \
            | anthropic environments | jq -r .id)
          echo "environment_id=$environment_id" >> "$GITHUB_OUTPUT"
          session_id=$(jq -n \
            --arg agent "$agent_id" --arg environment "$environment_id" \
            --arg url "$REPOSITORY_URL" --arg mount "$workspace" --arg token "$PUSH_TOKEN" \
            --arg branch "$CHECKOUT_BRANCH" --arg budget "$BUDGET_CENTS" \
            --arg kind "$kind" --arg number "$NUMBER" --arg title "$TITLE" --arg body "$BODY" --arg note "$run_note" \
            '{
              agent: $agent,
              environment_id: $environment,
              resources: [{type: "github_repository", url: $url, mount_path: $mount, authorization_token: $token, checkout: {type: "branch", name: $branch}}],
              budget: {type: "limit", max_list_cost: {amount: $budget, currency: "USD"}},
              initial_events: [{type: "user.message", content: [{type: "text", text: ($kind + " #" + $number + ": " + $title + "\n\n" + $body + (if $note == "" then "" else "\n\n" + $note end))}]}]
            }' \
            | anthropic sessions | jq -r .id)
          echo "session_id=$session_id" >> "$GITHUB_OUTPUT"

      - name: Wait for the session to finish
        id: outcome
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SESSION_ID: ${{ steps.session.outputs.session_id }}
        run: |
          set -euo pipefail
          anthropic_get() {
            local response
            response=$(curl -sS --fail-with-body "$ANTHROPIC_API/$1" \
              -H "x-api-key: $ANTHROPIC_API_KEY" \
              -H "anthropic-version: $ANTHROPIC_VERSION" \
              -H "anthropic-beta: $ANTHROPIC_BETA") || { echo "GET $1 failed: $response" >&2; return 1; }
            echo "$response"
          }
          deadline=$((SECONDS + 50 * 60))
          while :; do
            session=$(anthropic_get "sessions/$SESSION_ID")
            status=$(jq -r .status <<<"$session")
            case "$status" in
              running|rescheduling) ;;
              *) break ;;
            esac
            if (( SECONDS > deadline )); then status=timed-out; break; fi
            sleep 30
          done
          events='{"data":[]}'
          page=""
          while :; do
            batch=$(anthropic_get "sessions/$SESSION_ID/events${page:+?page=$page}")
            events=$(jq -c --argjson batch "$batch" '.data += $batch.data' <<<"$events")
            page=$(jq -r '.next_page // empty' <<<"$batch")
            [ -n "$page" ] || break
          done
          jq -r '[.data[] | select(.type == "agent.message")] | last // {} | [.content[]? | select(.type == "text") | .text] | join("\n")' <<<"$events" > "$RUNNER_TEMP/summary.md"
          jq -r '[.data[] | select(.type == "session.error") | .error.message] | join("\n")' <<<"$events" > "$RUNNER_TEMP/errors.txt"
          {
            echo "status=$status"
            echo "stop_reason=$(jq -r '[.data[] | select(.type == "session.status_idle")] | last // {} | .stop_reason.type // "none"' <<<"$events")"
            echo "cost_cents=$(jq -r '.usage.list_cost.amount // "unknown"' <<<"$session")"
            echo "cache=$(jq -r '.usage | "\(.cache_read_input_tokens // 0) cache-read, \(.cache_creation_input_tokens // 0) cache-written, \(.input_tokens // 0) uncached input tokens"' <<<"$session")"
          } >> "$GITHUB_OUTPUT"

      - name: Mint the reporting token
        id: report-token
        if: always() && steps.session.outputs.session_id != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: Iv23liOdEzeYFi4AjZwp
          private-key: ${{ secrets.RIN_AUTHOR_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-pull-requests: write
          permission-issues: write

      - name: Report the outcome
        if: always() && steps.report-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.report-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          STATUS: ${{ steps.outcome.outputs.status }}
          STOP_REASON: ${{ steps.outcome.outputs.stop_reason }}
          COST_CENTS: ${{ steps.outcome.outputs.cost_cents }}
          CACHE: ${{ steps.outcome.outputs.cache }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          touch "$RUNNER_TEMP/summary.md" "$RUNNER_TEMP/errors.txt"
          outcome="Agent session ${STATUS:-not started}, stop reason ${STOP_REASON:-none}, list cost ${COST_CENTS:-unknown} US cents, ${CACHE:-cache unknown}. [Run]($RUN_URL)"
          if [ "$MODE" = claude ] && head_message=$(gh api "repos/$GH_REPO/commits/$AGENT_BRANCH" --jq .commit.message 2>/dev/null); then
            body_file="$RUNNER_TEMP/pull-request.md"
            { echo "Closes #$NUMBER"; echo; cat "$RUNNER_TEMP/summary.md"; echo; echo "$outcome"; } > "$body_file"
            pull_request=$(gh pr create --draft --base main --head "$AGENT_BRANCH" \
              --title "$(head -n1 <<<"$head_message")" --body-file "$body_file")
            gh issue comment "$NUMBER" --body "Draft pull request: $pull_request"$'\n\n'"$outcome"
          else
            case "$MODE" in
              claude) heading="The agent pushed no branch." ;;
              claude-triage) heading="**Agent triage**" ;;
              claude-review) heading="**Agent review**" ;;
            esac
            comment_file="$RUNNER_TEMP/comment.md"
            { echo "$heading"; echo; cat "$RUNNER_TEMP/summary.md"; echo; cat "$RUNNER_TEMP/errors.txt"; echo; echo "$outcome"; } > "$comment_file"
            gh issue comment "$NUMBER" --body-file "$comment_file"
          fi
          if [ "$STARTED_BY_LABEL" = true ]; then
            gh issue edit "$NUMBER" --remove-label "$MODE"
          fi

      - name: Clean up the agent and environment
        if: always() && steps.session.outputs.agent_id != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AGENT_ID: ${{ steps.session.outputs.agent_id }}
          ENVIRONMENT_ID: ${{ steps.session.outputs.environment_id }}
        run: |
          headers=(-H "x-api-key: $ANTHROPIC_API_KEY" -H "anthropic-version: $ANTHROPIC_VERSION" -H "anthropic-beta: $ANTHROPIC_BETA")
          curl -sS -X POST "${headers[@]}" "$ANTHROPIC_API/agents/$AGENT_ID/archive" > /dev/null || true
          if [ -n "$ENVIRONMENT_ID" ]; then
            curl -sS -X DELETE "${headers[@]}" "$ANTHROPIC_API/environments/$ENVIRONMENT_ID" > /dev/null || true
          fi
