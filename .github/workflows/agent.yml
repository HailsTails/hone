name: Agent

on:
  issues:
    types: [labeled]
  pull_request:
    types: [opened, ready_for_review, synchronize, labeled]

permissions: {}

concurrency:
  group: agent-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

env:
  ANTHROPIC_API: https://api.anthropic.com/v1
  ANTHROPIC_VERSION: 2026-10-21
  ANTHROPIC_BETA: managed-agents-2026-04-01
  BUDGET_CENTS: '1500'
  MODE: ${{ github.event_name == 'pull_request' && 'claude-review' || github.event.label.name }}
  NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
  AGENT_BRANCH: agent/issue-${{ github.event.issue.number }}
  CHECKOUT_BRANCH: ${{ github.event.pull_request.head.ref || 'main' }}
  HANDBACK_LIMIT: '2'
  STARTED_BY_LABEL: ${{ github.event.action == 'labeled' }}

jobs:
  agent:
    name: Managed agent
    if: >-
      (github.event_name == 'issues' &&
        contains(fromJSON('["claude", "claude-triage"]'), github.event.label.name) &&
        (github.event.sender.login == github.repository_owner || github.event.sender.login == 'rin-author[bot]')) ||
      (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (github.event.action == 'opened' ||
          github.event.action == 'ready_for_review' ||
          (github.event.action == 'synchronize' && startsWith(github.event.pull_request.head.ref, 'agent/issue-')) ||
          (github.event.action == 'labeled' && github.event.label.name == 'claude-review' && github.event.sender.login == github.repository_owner)))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions: {}
    defaults:
      run:
        shell: bash
    steps:
      - name: Mint the push token
        id: push-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: Iv23liOdEzeYFi4AjZwp
          private-key: ${{ secrets.RIN_AUTHOR_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: ${{ github.event.label.name == 'claude' && github.event_name == 'issues' && 'write' || 'read' }}
          permission-pull-requests: read
          permission-issues: read

      - name: Start the session
        id: session
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PUSH_TOKEN: ${{ steps.push-token.outputs.token }}
          GH_TOKEN: ${{ steps.push-token.outputs.token }}
          REPOSITORY_URL: ${{ github.event.repository.html_url }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          TITLE: ${{ github.event.issue.title || github.event.pull_request.title }}
          BODY: ${{ github.event.issue.body || github.event.pull_request.body }}
        run: |
          set -euo pipefail
          anthropic() {
            local response
            response=$(curl -sS --fail-with-body "$ANTHROPIC_API/$1" \
              -H "x-api-key: $ANTHROPIC_API_KEY" \
              -H "anthropic-version: $ANTHROPIC_VERSION" \
              -H "anthropic-beta: $ANTHROPIC_BETA" \
              -H "content-type: application/json" \
              --data-binary @-) || { echo "POST $1 failed: $response" >&2; return 1; }
            echo "$response"
          }
          anthropic_get() {
            local response
            response=$(curl -sS --fail-with-body "$ANTHROPIC_API/$1" \
              -H "x-api-key: $ANTHROPIC_API_KEY" \
              -H "anthropic-version: $ANTHROPIC_VERSION" \
              -H "anthropic-beta: $ANTHROPIC_BETA") || { echo "GET $1 failed: $response" >&2; return 1; }
            echo "$response"
          }
          resource_id() {
            local id
            id=$(anthropic_get "$1" | jq -r --arg name "$2" '[.data[] | select(.name == $name and .archived_at == null)] | first | .id // empty')
            [ -n "$id" ] || { echo "No active $1 named $2: run the Agent definitions workflow" >&2; return 1; }
            echo "$id"
          }
          workspace="/workspace/$REPOSITORY_NAME"
          checkout="$CHECKOUT_BRANCH"
          follow_up_pr=""
          if [ "$MODE" = claude ] && gh api "repos/$GITHUB_REPOSITORY/branches/$AGENT_BRANCH" > /dev/null 2>&1; then
            checkout="$AGENT_BRANCH"
            follow_up_pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$AGENT_BRANCH" --state open --json number --jq '.[0].number // empty')
          fi
          echo "follow_up_pr=$follow_up_pr" >> "$GITHUB_OUTPUT"
          case "$MODE" in
            claude)
              agent_name="Hone builder"; kind=Issue
              if [ -n "$follow_up_pr" ]; then
                review=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$follow_up_pr/reviews" --jq '[.[] | select(.body | startswith("**Agent review**"))] | last | .body // ""')
                [ -n "$review" ] || review=$(gh api "repos/$GITHUB_REPOSITORY/issues/$follow_up_pr/comments" --jq '[.[] | select(.body | startswith("**Agent review**"))] | last | .body // ""')
                run_note="This is follow-up work. The branch $AGENT_BRANCH, open as pull request #$follow_up_pr, is checked out instead of main. Continue on it: address the review below, keep pnpm run check green, and push to the same branch."$'\n\n'"$review"
              else
                run_note="Push your work to the branch $AGENT_BRANCH."
              fi ;;
            claude-triage) agent_name="Hone triager"; kind=Issue; run_note="" ;;
            claude-review) agent_name="Hone reviewer"; kind="Pull request"; run_note="Its branch $CHECKOUT_BRANCH is checked out." ;;
          esac
          agent_id=$(resource_id agents "$agent_name")
          environment_id=$(resource_id environments hone)
          session_id=$(jq -n \
            --arg agent "$agent_id" --arg environment "$environment_id" \
            --arg url "$REPOSITORY_URL" --arg mount "$workspace" --arg token "$PUSH_TOKEN" \
            --arg branch "$checkout" --arg budget "$BUDGET_CENTS" \
            --arg kind "$kind" --arg number "$NUMBER" --arg title "$TITLE" --arg body "$BODY" --arg note "$run_note" \
            '{
              agent: $agent,
              environment_id: $environment,
              resources: [{type: "github_repository", url: $url, mount_path: $mount, authorization_token: $token, checkout: {type: "branch", name: $branch}}],
              budget: {type: "limit", max_list_cost: {amount: $budget, currency: "USD"}},
              initial_events: [{type: "user.message", content: [{type: "text", text: ($kind + " #" + $number + ": " + $title + "\n\n" + $body + (if $note == "" then "" else "\n\n" + $note end))}]}]
            }' \
            | anthropic sessions | jq -r .id)
          echo "session_id=$session_id" >> "$GITHUB_OUTPUT"

      - name: Wait for the session to finish
        id: outcome
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SESSION_ID: ${{ steps.session.outputs.session_id }}
        run: |
          set -euo pipefail
          anthropic_get() {
            local response
            response=$(curl -sS --fail-with-body "$ANTHROPIC_API/$1" \
              -H "x-api-key: $ANTHROPIC_API_KEY" \
              -H "anthropic-version: $ANTHROPIC_VERSION" \
              -H "anthropic-beta: $ANTHROPIC_BETA") || { echo "GET $1 failed: $response" >&2; return 1; }
            echo "$response"
          }
          deadline=$((SECONDS + 50 * 60))
          while :; do
            session=$(anthropic_get "sessions/$SESSION_ID")
            status=$(jq -r .status <<<"$session")
            case "$status" in
              running|rescheduling) ;;
              *) break ;;
            esac
            if (( SECONDS > deadline )); then status=timed-out; break; fi
            sleep 30
          done
          events="$RUNNER_TEMP/events.jsonl"
          : > "$events"
          page=""
          while :; do
            anthropic_get "sessions/$SESSION_ID/events${page:+?page=$page}" > "$RUNNER_TEMP/page.json"
            jq -c '.data[]' "$RUNNER_TEMP/page.json" >> "$events"
            page=$(jq -r '.next_page // empty' "$RUNNER_TEMP/page.json")
            [ -n "$page" ] || break
          done
          jq -rs '[.[] | select(.type == "agent.message")] | last // {} | [.content[]? | select(.type == "text") | .text] | join("\n")' "$events" > "$RUNNER_TEMP/summary.md"
          jq -rs '[.[] | select(.type == "session.error") | .error.message] | join("\n")' "$events" > "$RUNNER_TEMP/errors.txt"
          {
            echo "status=$status"
            echo "stop_reason=$(jq -rs '[.[] | select(.type == "session.status_idle")] | last // {} | .stop_reason.type // "none"' "$events")"
            echo "cost_cents=$(jq -r '.usage.list_cost.amount // "unknown"' <<<"$session")"
            echo "cache=$(jq -r '.usage | "\(.cache_read_input_tokens // 0) cache-read, \(.cache_creation_input_tokens // 0) cache-written, \(.input_tokens // 0) uncached input tokens"' <<<"$session")"
          } >> "$GITHUB_OUTPUT"

      - name: Mint the reporting token
        id: report-token
        if: always() && steps.session.outputs.session_id != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: Iv23liOdEzeYFi4AjZwp
          private-key: ${{ secrets.RIN_AUTHOR_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-pull-requests: write
          permission-issues: write

      - name: Mint the reviewer token
        id: reviewer-token
        if: always() && env.MODE == 'claude-review' && steps.session.outputs.session_id != ''
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: Iv23liZ4Z4iNu2j2LrOT
          private-key: ${{ secrets.RIN_REVIEWER_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-pull-requests: write

      - name: Report the outcome
        if: always() && steps.report-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.report-token.outputs.token }}
          REVIEWER_TOKEN: ${{ steps.reviewer-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          STATUS: ${{ steps.outcome.outputs.status }}
          STOP_REASON: ${{ steps.outcome.outputs.stop_reason }}
          COST_CENTS: ${{ steps.outcome.outputs.cost_cents }}
          CACHE: ${{ steps.outcome.outputs.cache }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FOLLOW_UP_PR: ${{ steps.session.outputs.follow_up_pr }}
        run: |
          set -euo pipefail
          touch "$RUNNER_TEMP/summary.md" "$RUNNER_TEMP/errors.txt"
          outcome="Agent session ${STATUS:-not started}, stop reason ${STOP_REASON:-none}, list cost ${COST_CENTS:-unknown} US cents, ${CACHE:-cache unknown}. [Run]($RUN_URL)"
          if [ "$MODE" = claude ] && [ -n "$FOLLOW_UP_PR" ]; then
            comment_file="$RUNNER_TEMP/comment.md"
            { echo "**Builder follow-up**"; echo; cat "$RUNNER_TEMP/summary.md"; echo; cat "$RUNNER_TEMP/errors.txt"; echo; echo "$outcome"; } > "$comment_file"
            gh pr comment "$FOLLOW_UP_PR" --body-file "$comment_file"
          elif [ "$MODE" = claude ] && head_message=$(gh api "repos/$GH_REPO/commits/$AGENT_BRANCH" --jq .commit.message 2>/dev/null); then
            body_file="$RUNNER_TEMP/pull-request.md"
            { echo "Closes #$NUMBER"; echo; cat "$RUNNER_TEMP/summary.md"; echo; echo "$outcome"; } > "$body_file"
            pull_request=$(gh pr create --draft --base main --head "$AGENT_BRANCH" \
              --title "$(head -n1 <<<"$head_message")" --body-file "$body_file")
            gh issue comment "$NUMBER" --body "Draft pull request: $pull_request"$'\n\n'"$outcome"
          else
            case "$MODE" in
              claude) heading="The agent pushed no branch." ;;
              claude-triage) heading="**Agent triage**" ;;
              claude-review) heading="**Agent review**" ;;
            esac
            comment_file="$RUNNER_TEMP/comment.md"
            { echo "$heading"; echo; cat "$RUNNER_TEMP/summary.md"; echo; cat "$RUNNER_TEMP/errors.txt"; echo; echo "$outcome"; } > "$comment_file"
            if [ "$MODE" = claude-review ] && [ -n "$REVIEWER_TOKEN" ]; then
              GH_TOKEN="$REVIEWER_TOKEN" gh pr review "$NUMBER" --comment --body-file "$comment_file"
            else
              gh issue comment "$NUMBER" --body-file "$comment_file"
            fi
          fi
          if [ "$STARTED_BY_LABEL" = true ]; then
            gh issue edit "$NUMBER" --remove-label "$MODE"
          fi
          if [ "$MODE" = claude-review ] && [[ "$CHECKOUT_BRANCH" =~ ^agent/issue-([0-9]+)$ ]]; then
            issue="${BASH_REMATCH[1]}"
            verdict=$(grep -m1 -v '^[[:space:]]*$' "$RUNNER_TEMP/summary.md" || true)
            handbacks=$(gh api "repos/$GH_REPO/issues/$NUMBER/comments" --jq '[.[] | select(.body | startswith("**Builder follow-up**"))] | length')
            if [ -n "$verdict" ] && [[ "$verdict" != *"No findings"* ]] && (( handbacks < HANDBACK_LIMIT )); then
              gh issue edit "$issue" --add-label claude
              gh pr comment "$NUMBER" --body "Handed back to the builder on #$issue to address this review (follow-up $((handbacks + 1)) of $HANDBACK_LIMIT)."
            fi
          fi

