name: Release

on:
  push:
    branches: [main]
    paths: [package.json]

permissions: {}

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  version:
    name: Find whether this push releases a version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.state.outputs.tag }}
      state: ${{ steps.state.outputs.state }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.18.0
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Decide whether this push releases the package version
        id: state
        env:
          PREVIOUS_REVISION: ${{ github.event.before }}
        run: |
          git fetch --no-tags --depth=1 origin "$PREVIOUS_REVISION"
          previous_manifest="$(git show "$PREVIOUS_REVISION:package.json")"
          remote_tags="$(git ls-remote --tags --refs origin 'refs/tags/v*')"
          node delivery/release/release-state-command.ts "$GITHUB_SHA" "$(cat package.json)" "$previous_manifest" "$remote_tags" >> "$GITHUB_OUTPUT"

  release:
    name: Release the package tarball
    needs: version
    if: needs.version.outputs.state == 'unreleased'
    runs-on: windows-2025-vs2026
    timeout-minutes: 25
    permissions:
      contents: write
    outputs:
      tarball-name: ${{ steps.tarball.outputs.name }}
      tarball-sha256: ${{ steps.tarball.outputs.sha256 }}
      dist-tag: ${{ steps.dist-tag.outputs.value }}
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.18.0
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check
        run: pnpm run check
      - name: Check the package builds deterministically
        run: pnpm run package-determinism
      - name: Prove the package installs and runs in real consumers
        run: pnpm run install-proof
      - name: Pack the package
        run: pnpm run pack-package
      - name: Fingerprint the packed tarball
        id: tarball
        run: |
          tarballs=(artefacts/*.tgz)
          test "${#tarballs[@]}" -eq 1
          sha256="$(sha256sum "${tarballs[0]}" | cut -d ' ' -f 1)"
          echo "name=$(basename "${tarballs[0]}")" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
      - name: Choose the dist-tag
        id: dist-tag
        run: |
          dist_tag="$(node delivery/release/release-text-command.ts dist-tag "$RELEASE_TAG")"
          echo "value=$dist_tag" >> "$GITHUB_OUTPUT"
      - name: Tag the merged commit with a release holding the tarball
        env:
          GH_TOKEN: ${{ github.token }}
          TARBALL_NAME: ${{ steps.tarball.outputs.name }}
          DIST_TAG: ${{ steps.dist-tag.outputs.value }}
        run: |
          prerelease=()
          case "$DIST_TAG" in next) prerelease=(--prerelease) ;; esac
          title="$(node delivery/release/release-text-command.ts title "$RELEASE_TAG")"
          notes="$(node delivery/release/release-text-command.ts notes "$RELEASE_TAG")"
          gh release create "$RELEASE_TAG" "artefacts/$TARBALL_NAME" --target "$GITHUB_SHA" --title "$title" --notes "$notes" "${prerelease[@]}"
      - name: Refuse a release whose tag names another commit
        run: |
          remote_tags="$(git ls-remote --tags --refs origin "refs/tags/$RELEASE_TAG")"
          node delivery/release/release-tag-command.ts "$RELEASE_TAG" "$GITHUB_SHA" "$remote_tags"

  publish-npm:
    name: Stage the released tarball on npm
    needs: [version, release]
    if: vars.NPM_PUBLISH == 'enabled'
    environment: npm
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
      TARBALL_NAME: ${{ needs.release.outputs.tarball-name }}
      TARBALL_SHA256: ${{ needs.release.outputs.tarball-sha256 }}
      DIST_TAG: ${{ needs.release.outputs.dist-tag }}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.18.0
          registry-url: 'https://registry.npmjs.org'
      - name: Install the npm that supports staged publishing
        run: npm install --global npm@11.21.1
      - name: Download the tarball attached to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$TARBALL_NAME" in */* | '') exit 1 ;; *.tgz) ;; *) exit 1 ;; esac
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$TARBALL_NAME" --dir artefacts
      - name: Refuse any tarball but the one the release job packed
        run: |
          test -n "$TARBALL_SHA256"
          printf '%s  %s\n' "$TARBALL_SHA256" "artefacts/$TARBALL_NAME" | sha256sum --check --strict
      - name: Stage the tarball under its dist-tag for approval on npm
        run: |
          case "$DIST_TAG" in next | latest) ;; *) exit 1 ;; esac
          npm stage publish "./artefacts/$TARBALL_NAME" --tag "$DIST_TAG"
